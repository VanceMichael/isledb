rubrics:
  - id: 1
    type: f2p
    text: "Writer 提供半开区间范围删除入口并按现有序列号体系提交；区间内较旧点值被隐藏、较新点值存活，边界键、空区间和非法边界具有确定语义。"
  - id: 2
    type: f2p
    text: "范围墓碑经过 memtable、SST 编解码和重开后仍保持端点与序列；Get 不会被点键 Bloom 误导，Get、Scan 和 Iterator 对同一覆盖关系给出一致结果。"
  - id: 3
    type: f2p
    text: "Snapshot 及刷新前后的 Reader 遵守各自固定视图：墓碑提交前的视图保持旧结果，加载提交代际后的视图按范围和序列隐藏数据。"
  - id: 4
    type: f2p
    text: "压缩跨层合并、重叠范围和输出 SST 切分时不复活旧值或误删后写值；范围墓碑仅在不再遮蔽任何可能存活的低层版本并满足现有视图安全期后回收。"
  - id: 5
    type: f2p
    text: "启用变更流时，同一提交产生有序且可游标恢复的范围删除事件，包含准确的起止键；分页、重开 ChangeReader 和同批点操作不会丢失或重复该事件。"
  - id: 6
    type: f2p
    text: "SST/变更批次上传后而 CURRENT 发布前失败不会暴露范围删除；CURRENT 已提交但响应丢失时重试可辨认既有提交，不重复发布 SST、范围效果或变更事件。"
  - id: 7
    type: p2p
    text: "旧格式点记录和变更批次继续可读，现有 Put、PutWithTTL、单键 Delete、TTL、点读、扫描、压缩以及未启用变更流的数据库保持既有行为。"
